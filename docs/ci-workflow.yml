name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('forex_bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: forex_bot
        run: |
          python -m pip install --upgrade pip
          # Install without heavy optional deps that require system libs or Windows-only (MetaTrader5)
          pip install -r requirements.txt \
            --no-deps MetaTrader5 2>/dev/null || true
          pip install pytest pytest-cov

      - name: Create minimal .env for tests
        working-directory: forex_bot
        run: |
          cat <<'EOF' > .env
          OANDA_API_KEY=test_key
          OANDA_ACCOUNT_ID=001-001-000000-001
          OANDA_ENVIRONMENT=practice
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_CHAT_ID=
          EMAIL_SENDER=
          EMAIL_PASSWORD=
          EMAIL_RECIPIENT=
          NEWS_API_KEY=
          EOF

      - name: Run tests
        working-directory: forex_bot
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --ignore=tests/test_integration.py \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: forex_bot/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        working-directory: forex_bot
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501 \
            --exclude=.venv,__pycache__,.git,backtest/cache \
            --count \
            --statistics
